name: Forecast engine tests

on:
  pull_request:
    paths:
      - "forecast_engine.py"
      - "market_forecast.py"
      - "tests/**"
      - ".github/workflows/forecast-engine-tests.yml"
  push:
    branches: [main]
    paths:
      - "forecast_engine.py"
      - "market_forecast.py"
      - "tests/**"
      - ".github/workflows/forecast-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas pytest
      - name: Compile forecast modules
        run: python -m py_compile forecast_engine.py market_forecast.py
      - name: Run forecast engine tests
        run: python -m pytest -q tests/test_forecast_engine.py
