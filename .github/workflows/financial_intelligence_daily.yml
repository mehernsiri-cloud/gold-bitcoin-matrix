name: Daily Financial Intelligence Agent

on:
  schedule:
    - cron: '15 6 * * *' # Daily at 06:15 UTC (07:15 Paris in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: financial-intelligence-agent
  cancel-in-progress: false

jobs:
  collect-classify-analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight free dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests feedparser

      - name: Run financial event agent
        run: python financial_intelligence_agent.py --days 4

      - name: Commit event intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financial_events.csv data/financial_alerts.csv data/financial_agent_state.json
          if git diff --cached --quiet; then
            echo "No financial event changes."
          else
            git commit -m "Daily financial intelligence update"
            git push origin HEAD:main
          fi
