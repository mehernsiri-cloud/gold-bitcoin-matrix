name: Daily Financial Intelligence Agent

on:
  schedule:
    - cron: "17 7 * * *" # Daily at 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: financial-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-classify-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight free dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "requests>=2.30" "feedparser>=6.0.11"

      - name: Run financial event intelligence agent
        run: python financial_intelligence_agent.py --days 4

      - name: Persist events and alerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financial_events.csv data/financial_alerts.csv data/financial_agent_state.json
          if git diff --cached --quiet; then
            echo "No event changes to persist."
          else
            git commit -m "Daily financial intelligence update"
            git push
          fi
