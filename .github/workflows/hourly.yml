name: Hourly Predictions & ROI Update

on:
  schedule:
    - cron: '0 * * * *'  # every hour at minute 0
  workflow_dispatch:

# Serialize hourly runs and allow the workflow token to push data updates.
concurrency:
  group: hourly-predictions-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hourly-predictions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas yfinance requests pyyaml plotly textblob pytrends scikit-learn beautifulsoup4
          pip install playwright
          playwright install chromium

      - name: Create data folder and CSV/JSON files if missing
        run: |
          mkdir -p data
          touch data/actual_data.csv
          touch data/predictions_log.csv
          touch data/ai_predictions_log.csv
          touch data/market_forecasts.csv
          touch data/roi_data.json

      - name: Update market indicators
        run: python update_weights.py || echo "⚠️ update_weights.py failed, continuing"

      - name: Fetch actual data
        run: python fetch_data.py || echo "⚠️ fetch_data.py failed, continuing"

      - name: Run headless prediction script
        run: python predict_headless.py || echo "⚠️ predict_headless.py failed, continuing"

      - name: Generate AI predictions & backtest
        run: python run_ai_predictions.py || echo "⚠️ run_ai_predictions.py failed, continuing"

      - name: Update ROI data safely (max 90 seconds)
        run: timeout 90s python update_roi_data.py || echo "⚠️ ROI refresh unavailable or timed out; keeping the last valid ROI data and continuing"

      - name: Keep only 2026 history and deduplicate data
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          cutoff = pd.Timestamp("2026-01-01")
          configs = {
              "data/actual_data.csv": ["timestamp"],
              "data/predictions_log.csv": ["timestamp", "asset"],
              "data/ai_predictions_log.csv": ["timestamp", "asset"],
          }

          for filename, dedupe_cols in configs.items():
              path = Path(filename)
              if not path.exists() or path.stat().st_size == 0:
                  continue
              df = pd.read_csv(path)
              if "timestamp" not in df.columns:
                  raise ValueError(f"Missing timestamp column in {filename}")
              df["timestamp"] = pd.to_datetime(df["timestamp"], errors="coerce")
              df = df.dropna(subset=["timestamp"])
              df = df[df["timestamp"] >= cutoff]
              df = df.drop_duplicates(subset=dedupe_cols, keep="last")
              df = df.sort_values("timestamp")
              df.to_csv(path, index=False)
              print(f"{filename}: retained {len(df)} rows from 2026 onward")
          PY

      - name: Commit & push CSV/JSON updates
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add data/predictions_log.csv data/actual_data.csv data/ai_predictions_log.csv data/market_forecasts.csv data/roi_data.json weight.yaml

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Hourly update with ROI refresh"
          fi

          git pull --rebase -X theirs origin main
          git push origin HEAD:main
